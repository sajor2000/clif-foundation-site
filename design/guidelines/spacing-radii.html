<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Square-cornered system; 1px rules carry structure" name="Radii & borders" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--bg-page)"><div style="display:flex;gap:24px;align-items:center"><div style="display:grid;gap:8px;justify-items:center"><div style="width:96px;height:56px;border:1px solid var(--ink-950);border-radius:2px;background:var(--bg-figure)"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);font-size:11px">2px tag</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:96px;height:56px;border:1px solid var(--ink-950);border-radius:3px;background:var(--bg-figure)"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);font-size:11px">3px control</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:96px;height:56px;border:1px solid var(--ink-950);border-radius:6px;background:var(--bg-figure)"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);font-size:11px">6px panel / figure</span></div><div style="display:grid;gap:8px;font-size:13px;color:var(--text-body)"><span style="border-top:1px solid var(--ink-950);padding-top:4px">1px ink — table and list top</span><span style="border-top:1px solid var(--ink-200);padding-top:4px">1px ink-200 — between rows</span><span style="border-bottom:2px solid var(--ink-950);padding-bottom:4px">2px ink — active nav</span></div></div></body></html>
