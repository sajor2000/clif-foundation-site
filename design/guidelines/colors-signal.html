<!-- @dsCard group="Colors" viewport="700x170" subtitle="One family. 400 green is fill (and text on ink only); 700 petrol is text and links on light" name="Signal: green and petrol" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--bg-page)"><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px"><div style="display:grid;gap:6px;min-width:0"><div style="height:56px;border-radius:var(--radius-tag);background:var(--signal-100);border:1px solid var(--border)"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);color:var(--text-primary)">100 tint</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-xs);color:var(--text-muted)">#DCEFE6</span></div><div style="display:grid;gap:6px;min-width:0"><div style="height:56px;border-radius:var(--radius-tag);background:var(--signal-300);border:1px solid var(--border)"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);color:var(--text-primary)">300</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-xs);color:var(--text-muted)">#B9E3D0</span></div><div style="display:grid;gap:6px;min-width:0"><div style="height:56px;border-radius:var(--radius-tag);background:var(--signal-400);"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);color:var(--text-primary)">400 green</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-xs);color:var(--text-muted)">#3A9B78 · fills, dark actions</span></div><div style="display:grid;gap:6px;min-width:0"><div style="height:56px;border-radius:var(--radius-tag);background:var(--signal-500);"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);color:var(--text-primary)">500</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-xs);color:var(--text-muted)">#2E8B6A</span></div><div style="display:grid;gap:6px;min-width:0"><div style="height:56px;border-radius:var(--radius-tag);background:var(--signal-700);"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);color:var(--text-primary)">700 petrol</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-xs);color:var(--text-muted)">#12495E · links, eyebrows</span></div><div style="display:grid;gap:6px;min-width:0"><div style="height:56px;border-radius:var(--radius-tag);background:var(--signal-800);"></div><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);color:var(--text-primary)">800</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-xs);color:var(--text-muted)">#0D3B4C · hover</span></div></div><p style="margin:12px 0 0;font-size:var(--type-small);color:var(--text-body)">Green is never text on light grounds. In dark mode green takes over links and primary actions with ink text.</p></body></html>
