<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--bg-page)"><div style="display:grid;gap:8px;font-size:var(--type-small)"><div style="display:grid;grid-template-columns:150px 220px 1fr;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">--gutter</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">clamp(16px, 4vw, 56px)</span><span style="color:var(--text-muted)">page side padding</span></div><div style="display:grid;grid-template-columns:150px 220px 1fr;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">--section-y</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">clamp(72px, 9vw, 120px)</span><span style="color:var(--text-muted)">vertical section padding</span></div><div style="display:grid;grid-template-columns:150px 220px 1fr;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">--content-max</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">1424px</span><span style="color:var(--text-muted)">incl. gutters</span></div><div style="display:grid;grid-template-columns:150px 220px 1fr;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">--measure</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">680px</span><span style="color:var(--text-muted)">≈70 characters</span></div><div style="display:grid;grid-template-columns:150px 220px 1fr;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">--header-h</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-s)">72px</span><span style="color:var(--text-muted)">sticky header</span></div></div></body></html>
