<!-- @dsCard group="Brand" viewport="700x200" subtitle="Crimson belongs to the Consortium" name="Logo color rules" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--bg-page)"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:13px">
<div style="display:grid;gap:8px"><div style="height:72px;display:flex;align-items:center;justify-content:center;background:var(--bg-figure);border:1px solid var(--border);border-radius:6px"><img src="https://clif-icu.com/images/logos/clif_logo_transparent_FINAL_cropped.png" alt="" style="height:36px;filter:brightness(0)"></div><b>Do</b> ink logo on light</div>
<div style="display:grid;gap:8px"><div style="height:72px;display:flex;align-items:center;justify-content:center;background:var(--bg-inverse);border-radius:6px"><img src="https://clif-icu.com/images/logos/clif_logo_white_email.png" alt="" style="height:36px"></div><b>Do</b> white logo on dark</div>
<div style="display:grid;gap:8px"><div style="height:72px;display:flex;align-items:center;justify-content:center;background:var(--bg-figure);border:1px solid var(--border);border-radius:6px"><img src="https://clif-icu.com/images/logos/clif_logo_transparent_FINAL_cropped.png" alt="" style="height:36px"></div><b>Consortium only</b> crimson original, used where the Consortium is credited</div>
</div><p style="margin:12px 0 0;font-size:13px;color:var(--status-error)">Never recolor the logo petrol or green, and never place it on a green ground. Black on light, white on dark (var(--logo-filter)).</p></body></html>
