<body style="padding:24px;background:var(--bg-page)"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);font-size:var(--type-mono-xs);background:var(--status-proposed-bg);color:var(--status-proposed-fg);border:1px solid var(--ink-950);padding:2px 8px;border-radius:var(--radius-tag)">proposed</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);font-size:var(--type-mono-xs);background:var(--status-existing-bg);color:var(--status-existing-fg);border:1px solid var(--status-existing-bg);padding:2px 8px;border-radius:var(--radius-tag)">existing</span><span style="font-family:var(--font-mono);font-size:var(--type-mono-s);font-size:var(--type-mono-xs);background:transparent;color:var(--text-muted);border:1px solid var(--ink-600);padding:2px 8px;border-radius:var(--radius-tag)">journal</span><span style="font-size:var(--type-small);color:var(--text-body)">Every Foundation program, board seat, and draft statement carries <b>proposed</b>.</span></div></body></html>
